<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — منصة العيادة</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark">C</div>
    <h1>منصّة العيادة</h1>
    <p class="auth-sub">دخول خاص بالطبيب والسكرتيرة</p>

    <div class="error-msg" id="errBox"></div>

    <form id="loginForm">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">تسجيل الدخول</button>
    </form>
  </div>
</div>

<script type="module">
  import { auth, signInWithEmailAndPassword, fetchUserDoc, signOut, showError, clearError, onAuthStateChanged }
    from "./assets/js/core.js";

  const form = document.getElementById("loginForm");
  const errBox = document.getElementById("errBox");
  const loginBtn = document.getElementById("loginBtn");

  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    const userDoc = await fetchUserDoc(user.uid);
    if (userDoc && ["doctor", "secretary"].includes(userDoc.role) && userDoc.active === true) {
      window.location.href = "clinic-dashboard.html";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError(errBox);
    loginBtn.disabled = true;
    loginBtn.textContent = "جارِ التحقق...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const userDoc = await fetchUserDoc(cred.user.uid);

      if (!userDoc || !["doctor", "secretary"].includes(userDoc.role)) {
        await signOut(auth);
        showError(errBox, "هذا الحساب غير مخوّل بالدخول لهذه الصفحة");
        return;
      }
      if (userDoc.active !== true) {
        await signOut(auth);
        showError(errBox, "تم تعطيل هذا الحساب، راجع إدارة المنصة");
        return;
      }
      window.location.href = "clinic-dashboard.html";
    } catch (err) {
      showError(errBox, "بيانات الدخول غير صحيحة");
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "تسجيل الدخول";
    }
  });
</script>
</body>
</html>
